# Generated by the Right-Size Advisor.
schema_version: 1
egress:
  default: deny
  air_gapped: false
  allowlist:
  - name: model-downloads
    when: only during `make pull` (model-pull job)
    hosts:
    - registry.ollama.ai
    - '*.ollama.ai'
    - huggingface.co
    - '*.hf.co'
    audited: true
  - name: private-web-research
    service: searxng
    hosts:
    - configured search engines
    audited: true
    note: 'Fetched pages are untrusted input: no tool calls from retrieved text.'
  forbidden:
  - Ollama ':cloud' model tags
  - telemetry endpoints
  - hosted model APIs unless cloud_burst
cloud_burst:
  enabled: false
  requires:
  - per-request opt-in
  - PII redaction
  - zero-retention provider
  - audit log
sensitivity_tiers:
  Public:
    retrievable: true
  Personal:
    retrievable: true
  Confidential:
    retrievable: true
    acl_required: true
  Restricted:
    retrievable: false
    unlock: explicit per-session unlock by the owner
    enforced: true
derived_data:
  inherit_strictest_label: true
  applies_to:
  - chunks
  - embeddings
  - conversation summaries
  - memory cards
  - history index
retention:
  conversations_days: 365
  documents: keep_until_deleted
  memory_cards: admin_and_user_managed
  hard_delete_includes:
  - rows
  - vectors
  - backups on rotation
access_control:
  enforced_in: database query filter
  collections:
  - shared
  - personal
secrets:
  store_passwords: false
  source: OS keychain or vault; short-lived scoped tokens only
connectors:
  enabled:
  - calendar_readonly
  default_scope: read-only
  kill_switch: true
  log_last_accessed: true
confirmations:
  write_actions: always
  show_exact_payload: true
  actions:
  - send_email
  - post
  - purchase
  - delete
  - share
model_pinning:
  auto_upgrade: false
  verify_checksums: true
  promotion_requires: passing golden-set eval (recall@k, faithfulness, citation accuracy)
agents:
  watchdog: true
  pinned_models_only: true
customization:
  post_training: planned
  distillation: planned
  abliteration: not_requested
audit:
  log:
  - retrievals
  - tool_calls
  - connector_access
  - egress_events
  - model_changes
  location: local
