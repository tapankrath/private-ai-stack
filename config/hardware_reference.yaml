# When the exact chip/GPU is unknown, assume a conservative member of the class.
defaults_by_platform:
  apple: {hw_key: apple_m2}
  nvidia:
    - {max_vram_gb: 12, hw_key: rtx_3060}
    - {max_vram_gb: 16, hw_key: rtx_4060_ti}
    - {max_vram_gb: 24, hw_key: rtx_3090}
    - {max_vram_gb: 48, hw_key: rtx_a6000}
    - {max_vram_gb: 100000, hw_key: l40s}
  nvidia_unified: {hw_key: dgx_spark}
  amd_unified: {hw_key: amd_ryzen_ai_max_395}
  amd: {hw_key: cpu_ddr5}
  cpu: {hw_key: cpu_ddr4}

compute_class:               # by tflops_fp16
  high: 100
  medium: 30

# Usable share of unified memory for models (OS headroom kept back).
unified_usable_fraction:
  apple_up_to_36gb: 0.67
  apple_above_36gb: 0.75
  nvidia_unified: 0.85
  amd_unified: 0.75
