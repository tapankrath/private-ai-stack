  apple_m4_pro: 9.2
  apple_m1_max: 10.4
  apple_m2_max: 13.6
  apple_m3_max: 16.4
  apple_m4_max: 18.4
  apple_m5_max: 40           # M5 GPU adds neural accelerators; unverified
  apple_m2_ultra: 27
  apple_m3_ultra: 33
  rtx_3060: 51
  rtx_3090: 71
  rtx_4060_ti: 88
