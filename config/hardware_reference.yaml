  apple_m3_ultra: 819
  apple_m4: 120
  apple_m4_pro: 273
  apple_m4_max: 546
  apple_m5_max: 614            # third-party listing, Sept 2026
  rtx_3060: 360
  rtx_3080: 760
  rtx_3090: 936
  rtx_4060_ti: 288
