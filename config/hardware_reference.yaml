# Reference numbers for sizing. ALL VALUES ARE ROUGH ESTIMATES.
#
# Every response has two phases:
#   prefill - reading the whole prompt. COMPUTE-bound  -> tflops_fp16
#   decode  - writing tokens one by one. MEMORY-BANDWIDTH-bound -> bandwidth_gbps
# Prompt-heavy work (big RAG contexts, long documents) favors high-compute GPUs;
# generation-heavy work (drafting, code) favors high memory bandwidth.
# Override any value in a profile under hardware.override (bandwidth_gbps, tflops_fp16).
# Prices live in config/pricing.yaml, not here.

schema_version: 2

bandwidth_gbps:
  apple_m1: 68
  apple_m1_pro: 200
  apple_m1_max: 400
  apple_m1_ultra: 800
  apple_m2: 100
  apple_m2_pro: 200
  apple_m2_max: 400
  apple_m2_ultra: 800
  apple_m3: 100
