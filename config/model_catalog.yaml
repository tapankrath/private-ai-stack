# Model catalog used by the Right-Size Advisor.
#
# IMPORTANT: every entry here is an EXAMPLE seeded by hand. Open-weight models are
# released and relicensed often. Before relying on an entry:
#   1. run `scripts/update-catalog --allow-egress` (an explicit, logged egress step) to
#      refresh license and metadata from Hugging Face model cards, and
#   2. read the license yourself. `last_verified: null` means nobody has checked it yet.
#
# MEMORY uses TOTAL parameters; SPEED uses ACTIVE parameters (MoE vs dense).
# An MoE model with ~35B total / ~3B active needs the memory of a ~35B dense model but
# generates tokens at roughly the speed of a ~3B one.
#
# Open-weight is not the same as open source:
#   open_weight: weights are downloadable.   osi_open_source: license meets the OSD.
# commercial_triggers: license conditions that apply at scale. blocking: true triggers stop
# the model being selected for commercial use until licensing.acknowledged_triggers lists them.
#
# Memory numbers are computed by the advisor, not stored here:
#   weights_gb   = total_params_b * bits_per_weight(quant) / 8
#   kv_gb        = kv_bytes_per_token * context_tokens * concurrent_sessions / 1e9
#   kv_bytes_per_token (fp16) = 2 (K and V) * kv_layers * kv_heads * head_dim * 2 bytes
# `attention` fields come from each model's config.json. When unpublished, the entry carries
# kv_bytes_per_token_est and a kv_note instead.
# Auxiliary models (embeddings, rerankers, STT) store a fixed memory_gb instead.
#
# commercial_use: yes | no | conditional (conditional = allowed with terms; read them)

schema_version: 2
quantizations:
  Q4_K_M: 4.85
  Q5_K_M: 5.7
  Q8_0: 8.5
  AWQ: 4.6
  FP8: 8.5
  FP16: 16.0
runtime_overhead_gb: 0.6
