# Local-only monitoring (tier 3). No remote_write, no external telemetry.
global:
  scrape_interval: 30s
scrape_configs:
  - job_name: gateway
    metrics_path: /metrics
    authorization:
      credentials_file: /run/secrets/gateway_key
    static_configs:
      - targets: ["gateway:8080"]
  - job_name: vllm
    static_configs:
      - targets: ["vllm:8000"]          # vLLM exposes /metrics (queue depth, tokens/s, KV cache use)
