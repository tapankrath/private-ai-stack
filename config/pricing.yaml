# Prices used by the advisor's hardware options and 3-year TCO (advisor/tco.py).
# Prices are volatile: memory shortages pushed some high-memory machines UP in price in 2026,
# so they may hold value instead of depreciating. Every entry carries last_verified; the
# advisor flags entries older than `stale_after_days` or never verified (null).
# All figures are estimates in USD.

schema_version: 1
stale_after_days: 60

