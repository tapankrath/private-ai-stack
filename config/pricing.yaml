  pro_ai_workstation: "Through a VAR on a quote (roughly $100k): more memory and GPU cores, e.g. DGX Station-class. Large Tier 3."
  enterprise_ai_infrastructure: "Rack-scale systems in data-center facilities. Out of scope: if a profile needs this, it has outgrown local."

