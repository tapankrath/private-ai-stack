<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Private AI Setup Guide</title>
<meta name="description" content="Set up a private, local AI assistant on a Mac, Windows or Linux computer, at any skill level, including on hardware other than the recommended one.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a reading page. Contents rail on the left (desktop), one 70-character column of text. */
:root {
  --bg: #f5f7f6; --surface: #ffffff; --sunk: #eef2f0; --ink: #16221e; --muted: #5a6964; --line: #dbe3df;
  --accent: #14735c; --accent-soft: #e2f1eb; --accent-line: #a9d3c3;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1513; --surface: #161e1b; --sunk: #1c2622; --ink: #e4ece8; --muted: #95a59f; --line: #2a3632;
  --accent: #4cc39f; --accent-soft: #173229; --accent-line: #2e6553; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1513; --surface: #161e1b; --sunk: #1c2622; --ink: #e4ece8; --muted: #95a59f; --line: #2a3632;
  --accent: #4cc39f; --accent-soft: #173229; --accent-line: #2e6553; color-scheme: dark }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.65 var(--f-body); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
.wrap { max-width: 1160px; margin: 0 auto; padding-block: 20px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px 20px; margin-bottom: 28px; }
.brand { display: flex; align-items: center; gap: 10px; font: 700 18px var(--f-display); color: var(--ink); text-decoration: none; }
.bar nav { display: flex; gap: 18px; font-size: 14px; }
.bar nav a { color: var(--muted); text-decoration: none; font-weight: 500; }
.layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 40px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); gap: 16px; } }
.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); font-size: 14px; }
@media (max-width: 860px) { .toc { position: static; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; } }
.toc p { font: 500 11.5px var(--f-mono); text-transform: uppercase; letter-spacing: .09em; color: var(--accent); margin: 0 0 8px; }
.toc ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.toc a { color: var(--muted); text-decoration: none; }
.toc a:hover { color: var(--ink); }
article { min-width: 0; max-width: 72ch; }
article h1 { font: 700 clamp(30px, 4.5vw, 44px)/1.1 var(--f-display); letter-spacing: -.02em; margin: 0 0 14px; text-wrap: balance; }
article h2 { font: 700 24px/1.25 var(--f-display); margin: 48px 0 12px; padding-top: 18px; border-top: 1px solid var(--line); text-wrap: balance; scroll-margin-top: 16px; }
article h3 { font: 700 18px/1.3 var(--f-display); margin: 30px 0 8px; }
article p, article li { text-wrap: pretty; }
article ul, article ol { padding-left: 22px; }
article li { margin: 4px 0; }
article li > ul { margin: 4px 0; }
code { font-family: var(--f-mono); font-size: .88em; background: var(--sunk); border-radius: 4px; padding: 1px 5px; }
pre { position: relative; background: var(--sunk); border: 1px solid var(--line); border-radius: 10px; padding: 12px 70px 12px 14px; overflow-x: auto; font: 13.5px/1.6 var(--f-mono); }
pre code { background: none; padding: 0; font-size: inherit; }
pre button { position: absolute; top: 8px; right: 8px; font: 600 12px var(--f-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; cursor: pointer; }
.tbl { overflow-x: auto; margin: 14px 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
th { text-align: left; font-weight: 600; font-size: 13px; color: var(--muted); background: var(--sunk); padding: 9px 12px; border-bottom: 1px solid var(--line); }
td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
blockquote { margin: 16px 0; padding: 12px 16px; background: var(--accent-soft); border-radius: 10px; }
blockquote p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <a class="brand" href="index.html">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect x="1" y="1" width="26" height="26" rx="7" fill="var(--accent)"/><path d="M8 19V9m4 10v-6m4 6v-8m4 8v-4" stroke="var(--surface)" stroke-width="2.4" stroke-linecap="round"/></svg>
      Right-Size Advisor
    </a>
    <nav aria-label="Links"><a href="index.html">Advisor</a><a href="https://github.com/tapankrath/private-ai-stack" target="_blank" rel="noopener">Source code</a></nav>
  </div>
  <div class="layout">
    <nav class="toc" aria-label="Contents"><p>Contents</p><ol><!--TOC--></ol></nav>
    <article>
<!--BODY-->
    </article>
  </div>
</div>
<script>
document.querySelectorAll("article table").forEach(function (t) { var d = document.createElement("div"); d.className = "tbl"; t.parentNode.insertBefore(d, t); d.appendChild(t); });
document.querySelectorAll("article pre").forEach(function (pre) {
  var b = document.createElement("button"); b.type = "button"; b.textContent = "Copy"; pre.appendChild(b);
  b.addEventListener("click", function () {
    var txt = pre.querySelector("code").textContent;
    var done = function () { b.textContent = "Copied"; setTimeout(function () { b.textContent = "Copy"; }, 1500); };
    var fail = function () { var r = document.createRange(); r.selectNodeContents(pre.querySelector("code")); var s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "Selected"; };
    try { navigator.clipboard.writeText(txt).then(done, fail); } catch (e) { fail(); }
  });
});
</script>
</body>
</html>
