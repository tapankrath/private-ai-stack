[project]
name = "private-ai-advisor"
version = "0.3.0"
description = "Private, local-first AI assistant: Right-Size Advisor and Gateway (Recall, memory, policy)"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "jsonschema>=4.18"]

[project.optional-dependencies]
gateway = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "numpy>=1.26", "pyjwt[crypto]>=2.8",
           "pypdf>=4", "python-docx>=1.1"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "httpx>=0.27"]
detect = ["psutil>=5"]

[project.scripts]
advise = "advisor.cli:main"
gateway = "gateway.cli:main"

[tool.setuptools]
packages = ["advisor", "gateway", "gateway.store"]

[tool.setuptools.package-data]
advisor = ["prompts/*", "schema/*"]
gateway = ["ui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
