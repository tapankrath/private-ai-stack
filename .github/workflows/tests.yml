name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: admin, POSTGRES_DB: gateway }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install -e ".[dev,gateway,postgres]"
      - name: Tests (SQLite)
        run: pytest -q
      - name: Prepare Postgres roles
        env: { PGPASSWORD: admin }
        run: |
          psql -h 127.0.0.1 -U postgres -d gateway -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS vector;
          CREATE ROLE gateway_app LOGIN PASSWORD 'apppw';
          GRANT CONNECT ON DATABASE gateway TO gateway_app;
          GRANT USAGE ON SCHEMA public TO gateway_app;
          SQL
      - name: Gateway tests (Postgres, row-level security)
        env:
          GATEWAY_TEST_PG: postgresql://gateway_app:apppw@127.0.0.1:5432/gateway
          GATEWAY_TEST_PG_ADMIN: postgresql://postgres:admin@127.0.0.1:5432/gateway
        run: pytest -q tests/gateway
